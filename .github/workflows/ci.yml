name: CI — macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    env:
      # Authenticated GitHub API avoids 403 rate limits in prepare-macos-llm.sh
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FLOWSIGHT_LLM_ARCH: macos-arm64
      FLOWSIGHT_SKIP_LLM_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri -> target

      - name: Prepare macOS llama-server (Metal)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-macos-llm.sh
          test -x local_llm/bin/llama-server
          lipo -archs local_llm/bin/llama-server | grep -q arm64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer tests
        run: pnpm --filter @flowsight/agent exec node --test

      - name: Production renderer
        run: pnpm --filter @flowsight/agent exec vite build

      - name: Formatting
        run: cargo fmt --manifest-path apps/agent/src-tauri/Cargo.toml --check

      - name: Cargo check
        run: cargo check --manifest-path apps/agent/src-tauri/Cargo.toml

      - name: Unit tests
        run: cargo test --manifest-path apps/agent/src-tauri/Cargo.toml --lib

      - name: Clippy
        run: cargo clippy --manifest-path apps/agent/src-tauri/Cargo.toml --lib -- -D warnings

      - name: Native macOS application build
        run: pnpm --filter @flowsight/agent exec tauri build --no-bundle
