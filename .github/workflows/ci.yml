name: CI — macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      # Authenticated GitHub API avoids 403 rate limits in prepare-macos-llm.sh
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FLOWSIGHT_LLM_ARCH: macos-arm64
      FLOWSIGHT_SKIP_LLM_RUN: "1"
      FLOWSIGHT_RENDERER_URL: http://127.0.0.1:1420
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri -> target

      - name: Prepare macOS llama-server (Metal)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-macos-llm.sh
          test -x local_llm/bin/llama-server
          lipo -archs local_llm/bin/llama-server | grep -q arm64

      - name: Fetch and verify Qwen3-VL-2B weights
        run: node scripts/fetch-models.mjs

      - name: Compile actual session planner probe
        run: |
          python3 scripts/prepare-session-plan-harness.py
          cargo build --manifest-path .impeccable/review/suggestions-harness/Cargo.toml --release

      - name: Prove native Qwen ADDA planning and revision
        env:
          FLOWSIGHT_PLAN_REVISE: "1"
        run: node scripts/probe-session-suggestions.mjs

      - name: Upload native Qwen session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-qwen-session
          path: |
            .impeccable/review/suggestions-qwen.json
            .impeccable/review/suggestions-harness/source-manifest.json
          if-no-files-found: ignore

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer tests
        run: pnpm --filter @flowsight/agent exec node --test

      - name: Production renderer
        run: pnpm --filter @flowsight/agent exec vite build

      - name: Install browser for renderer integration checks
        run: pnpm exec playwright install chromium

      - name: Onboarding and ADDA renderer checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @flowsight/agent exec vite preview --host 127.0.0.1 --port 1420 > /tmp/flowsight-renderer.log 2>&1 &
          renderer_pid=$!
          trap 'kill "$renderer_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:1420/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-session-onboarding.mjs
          node scripts/verify-adda-renderer.mjs
          node scripts/verify-dark-button-hovers.mjs

      - name: Upload renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-renderer-previews
          path: .impeccable/review/*.png
          if-no-files-found: ignore

      - name: Formatting
        run: cargo fmt --manifest-path apps/agent/src-tauri/Cargo.toml --check

      - name: Cargo check
        run: cargo check --manifest-path apps/agent/src-tauri/Cargo.toml

      - name: Unit tests
        run: cargo test --manifest-path apps/agent/src-tauri/Cargo.toml --lib

      - name: Clippy
        run: cargo clippy --manifest-path apps/agent/src-tauri/Cargo.toml --lib -- -D warnings

      - name: Native macOS application build
        run: pnpm --filter @flowsight/agent exec tauri build --no-bundle

      - name: Execute native MCP STDIO smoke test
        run: node scripts/check-mcp-stdio.mjs apps/agent/src-tauri/target/release/app
