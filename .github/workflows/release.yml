name: Release — FlowSight Agent (macOS)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach (e.g. v3.6.0)"
        required: true
        type: string

concurrency:
  group: release-macos-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Builds BOTH Apple Silicon (aarch64) and Intel (x86_64) DMGs from this repo.
# Secrets (optional): TAURI_*, NEXT_PUBLIC_*, APPLE_* for signing/notarization.

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-apple-darwin
            llm_arch: macos-arm64
            artifact: macos-aarch64
            updater_platform: darwin-aarch64
          - rust_target: x86_64-apple-darwin
            llm_arch: macos-x64
            artifact: macos-x86_64
            updater_platform: darwin-x86_64
    runs-on: macos-14
    env:
      TAURI_JIRA_CLIENT_ID: ${{ secrets.TAURI_JIRA_CLIENT_ID }}
      TAURI_JIRA_CLIENT_SECRET: ${{ secrets.TAURI_JIRA_CLIENT_SECRET }}
      TAURI_LINEAR_CLIENT_ID: ${{ secrets.TAURI_LINEAR_CLIENT_ID }}
      TAURI_LINEAR_CLIENT_SECRET: ${{ secrets.TAURI_LINEAR_CLIENT_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      FLOWSIGHT_LLM_ARCH: ${{ matrix.llm_arch }}
      FLOWSIGHT_SKIP_LLM_RUN: "1"
      # Authenticated API avoids 403 rate limits when resolving llama.cpp assets
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Rust stable (+ target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/agent/src-tauri -> target
          key: ${{ matrix.rust_target }}

      - name: Prepare macOS llama-server (Metal, ${{ matrix.llm_arch }})
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-macos-llm.sh
          test -x local_llm/bin/llama-server
          if [[ "${{ matrix.llm_arch }}" == "macos-arm64" ]]; then
            lipo -archs local_llm/bin/llama-server | grep -q arm64
          else
            lipo -archs local_llm/bin/llama-server | grep -q x86_64
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable updater artifacts when signing key is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("apps/agent/src-tauri/tauri.conf.json")
          cfg = json.loads(p.read_text())
          cfg.setdefault("bundle", {})["createUpdaterArtifacts"] = True
          p.write_text(json.dumps(cfg, indent=2) + "\n")
          print("createUpdaterArtifacts=true")
          PY
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY — building without updater signatures"
          fi

      - name: Build macOS app + DMG (${{ matrix.rust_target }})
        shell: bash
        run: |
          set -euo pipefail
          RUST_TARGET="${{ matrix.rust_target }}"
          # Empty/invalid Apple secrets make Tauri try `security import` and fail the bundle.
          SIGN_ARGS=()
          if [[ -z "${APPLE_CERTIFICATE:-}" || "${#APPLE_CERTIFICATE}" -lt 64 ]]; then
            echo "No valid APPLE_CERTIFICATE — ad-hoc signing the .app (Gatekeeper-safe)"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER || true
            # Without this, native arm64 gets a linker ad-hoc signature that does not seal
            # resources; Gatekeeper then reports the app as damaged/corrupt. x64 often
            # ships unsigned and still opens under Rosetta — which matched the user report.
            SIGN_ARGS+=(--config '{"bundle":{"macOS":{"signingIdentity":"-"}}}')
          else
            echo "APPLE_CERTIFICATE present — attempting signed build"
          fi
          corepack pnpm --filter @flowsight/agent exec tauri build --target "$RUST_TARGET" "${SIGN_ARGS[@]}"

          APP="apps/agent/src-tauri/target/${RUST_TARGET}/release/bundle/macos/FlowSight Agent.app"
          ENTITLEMENTS="apps/agent/src-tauri/Entitlements.plist"
          test -d "$APP"

          # Always deep ad-hoc re-sign when we are not Developer ID signed, then refresh DMG.
          if [[ -z "${APPLE_CERTIFICATE:-}" || "${#APPLE_CERTIFICATE}" -lt 64 ]]; then
            echo "Deep ad-hoc codesign to seal bundle resources..."
            codesign --force --deep --options runtime \
              --entitlements "$ENTITLEMENTS" \
              --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -25

          MAIN="$(ls "$APP/Contents/MacOS" | head -n1)"
          echo "main: $(file -b "$APP/Contents/MacOS/$MAIN")"
          LLAMA="$(find "$APP/Contents/Resources" -name llama-server | head -n1 || true)"
          if [[ -z "$LLAMA" ]]; then
            echo "ERROR: llama-server missing from bundle resources"
            exit 1
          fi
          echo "llama: $(file -b "$LLAMA")"
          if [[ "$RUST_TARGET" == aarch64-apple-darwin ]]; then
            lipo -archs "$LLAMA" | grep -q arm64
            ARCH_TAG="aarch64"
          else
            lipo -archs "$LLAMA" | grep -q x86_64
            ARCH_TAG="x64"
          fi

          # Recreate DMG from the sealed .app (Tauri may have packaged a pre-resign copy).
          VERSION="$(python3 -c "import json; print(json.load(open('apps/agent/src-tauri/tauri.conf.json'))['version'])")"
          DMG_DIR="apps/agent/src-tauri/target/${RUST_TARGET}/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          rm -f "$DMG_DIR"/*.dmg "$DMG_DIR"/*.sig 2>/dev/null || true
          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/FlowSight Agent.app"
          ln -s /Applications "$STAGE/Applications"
          DMG_PATH="$DMG_DIR/FlowSight Agent_${VERSION}_${ARCH_TAG}.dmg"
          hdiutil create -volname "FlowSight Agent" -srcfolder "$STAGE" -ov -format UDZO "$DMG_PATH"
          rm -rf "$STAGE"
          ls -lah "$DMG_DIR"
          hdiutil verify "$DMG_PATH"

      - name: Stage bundle + per-arch updater fragment
        shell: bash
        env:
          RELEASE_BODY: ${{ github.event.release.body || '' }}
          REPO: ${{ github.repository }}
          UPDATER_PLATFORM: ${{ matrix.updater_platform }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          DMG_DIR="apps/agent/src-tauri/target/${RUST_TARGET}/release/bundle/dmg"
          mkdir -p staged
          cp -f "$DMG_DIR"/*.dmg staged/ 2>/dev/null || true
          cp -f "$DMG_DIR"/*.sig staged/ 2>/dev/null || true
          DMG="$(ls staged/*.dmg | head -n1)"
          test -n "$DMG"
          # Normalize spaces → dots so release asset names match prior downloads.
          SAFE_DMG="staged/$(basename "$DMG" | tr ' ' '.')"
          if [[ "$DMG" != "$SAFE_DMG" ]]; then
            mv -f "$DMG" "$SAFE_DMG"
            DMG="$SAFE_DMG"
          fi
          SIG="$(ls staged/*.dmg.sig 2>/dev/null | head -n1 || true)"
          if [[ -n "${SIG}" && -f "${SIG}" ]]; then
            SAFE_SIG="staged/$(basename "$SIG" | tr ' ' '.')"
            if [[ "$SIG" != "$SAFE_SIG" ]]; then
              mv -f "$SIG" "$SAFE_SIG"
              SIG="$SAFE_SIG"
            fi
          fi
          BASENAME="$(basename "$DMG")"
          export ASSET_NAME="$BASENAME"
          export APP_VERSION="$(echo "$BASENAME" | sed -E 's/.*_([0-9]+\.[0-9]+\.[0-9]+)_.*/\1/')"
          export DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
          export PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export SIGNATURE=""
          if [[ -n "${SIG}" && -f "${SIG}" ]]; then
            export SIGNATURE="$(cat "$SIG")"
          fi
          node -e '
            const fs = require("fs");
            const platforms = {};
            if (process.env.SIGNATURE) {
              platforms[process.env.UPDATER_PLATFORM] = {
                signature: process.env.SIGNATURE,
                url: process.env.DOWNLOAD_URL
              };
            }
            const fragment = {
              version: process.env.APP_VERSION,
              notes: process.env.RELEASE_BODY || "",
              pub_date: process.env.PUB_DATE,
              platforms
            };
            fs.writeFileSync("staged/latest-fragment.json", JSON.stringify(fragment, null, 2));
            console.log(fragment);
          '
          ls -lah staged/

      - name: Upload macOS bundles (${{ matrix.artifact }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: staged/*
          if-no-files-found: error

  attach-to-release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge latest.json (aarch64 + x86_64)
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = require("path");
            function walk(dir, out=[]) {
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(p, out);
                else if (ent.name === "latest-fragment.json") out.push(p);
              }
              return out;
            }
            const files = walk("artifacts");
            if (!files.length) {
              console.log("No updater fragments (unsigned build) — skipping latest.json");
              process.exit(0);
            }
            const merged = { version: "", notes: "", pub_date: "", platforms: {} };
            for (const f of files) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              merged.version = j.version || merged.version;
              merged.notes = j.notes || merged.notes;
              merged.pub_date = j.pub_date || merged.pub_date;
              Object.assign(merged.platforms, j.platforms || {});
            }
            fs.writeFileSync("latest.json", JSON.stringify(merged, null, 2));
            console.log(merged);
          '

      - name: Attach installers to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          fail_on_unmatched_files: false
          overwrite_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.sig
            latest.json

      - name: Retry attach on transient GitHub 503
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(artifacts/**/*.dmg artifacts/**/*.sig)
          if [[ -f latest.json ]]; then
            files+=(latest.json)
          fi
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release assets to upload"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            echo "Upload attempt $i..."
            if gh release upload "$RELEASE_TAG" "${files[@]}" --clobber; then
              echo "Upload OK"
              exit 0
            fi
            sleep $((i * 15))
          done
          exit 1
